name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure development profile
        run: node scripts/configure-portable.mjs
      - name: Check game rules
        run: pnpm test
      - name: Check types
        run: pnpm check
      - name: Build website
        run: pnpm build
